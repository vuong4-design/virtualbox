name: Build VirtualBox 7.2 (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - VBox-7.2
      - 'feature/cloak*'
  pull_request:
    branches:
      - main
      - VBox-7.2
      - 'feature/cloak*'

permissions:
  contents: read

# Huỷ run cũ khi push mới lên cùng branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      KBUILD_PATH: ${{ github.workspace }}\kBuild\kBuild
      VBOX_WITHOUT_ADDITIONS: "1"
      VBOX_WITH_ADDITIONS_PACKING: ""

    steps:
      - name: Checkout VirtualBox
        uses: actions/checkout@v4
        with:
          # QUAN TRỌNG: phải build repo NÀY, không phải mirror upstream.
          # Trước đây workflow checkout "repository: VirtualBox/virtualbox" nên
          # mọi thay đổi trong repo của chúng ta đều không được compile.
          repository: ${{ github.repository }}
          fetch-depth: 1
          submodules: recursive

      - name: Record source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $sha    = git rev-parse HEAD;
          $desc   = git log -1 --pretty="%h %s";
          $branch = git rev-parse --abbrev-ref HEAD;
          $rev = @(
            "source_repo=${{ github.repository }}",
            "source_ref=${{ github.ref_name }}",
            "source_sha=$sha",
            "source_desc=$desc",
            "source_branch=$branch"
          );
          $rev | Set-Content -Path "source-revision.txt" -Encoding utf8;
          Get-Content "source-revision.txt";

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Verify kBuild and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Source directory ==="
          Write-Host $env:VBOX_SOURCE

          Write-Host "=== kBuild directory ==="
          Write-Host $env:KBUILD_PATH

          $required = @(
            "footer.kmk",
            "header.kmk",
            "rules.kmk",
            "bin\win.amd64\kmk.exe",
            "bin\win.amd64\kmk_ash.exe",
            "bin\win.x86\kmk.exe"
          )

          foreach ($item in $required) {
            # Sử dụng nối chuỗi trực tiếp để vô hiệu hóa lỗi mất khoảng trắng
            $path = "$env:KBUILD_PATH\$item"
            if (-not (Test-Path $path)) {
              throw "Missing required kBuild file: $path"
            }
            Write-Host "OK: $path"
          }

          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          
          # Nối chuỗi trực tiếp cho thư mục SDK Include
          if (-not (Test-Path "$sdk\Include")) {
            throw "Windows 10 SDK Include directory not found: $sdk"
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found. MSVC environment was not initialized."
          }

          Write-Host "=== Compiler ==="
          cl.exe 2>&1 | Select-Object -First 3

          Write-Host "=== SDK versions ==="
          Get-ChildItem "$sdk\Include" -Directory |
            Where-Object { $_.Name -like "10.0.*" } |
            Select-Object -ExpandProperty Name

      - name: Patch legacy DDK 7.1 check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $file = "$env:VBOX_SOURCE\configure.vbs";

          if (-not (Test-Path $file)) {
            throw "configure.vbs not found: $file";
          }

          # Sử dụng dấu chấm phẩy (;) để ngăn lỗi dính dòng khi copy/paste
          $lines = [System.IO.File]::ReadAllLines($file);
          $matches = @();

          for ($i = 2000; $i -lt $lines.Length; $i++) {
            if ($lines[$i].Contains("CheckForWinDDK") -and $lines[$i].Contains("strOptDDK") -and $lines[$i] -notmatch '^\s*(sub|function)\b') {
              $matches += $i;
            }
          }

          if ($matches.Count -ne 1) {
            throw "Expected one DDK check call; found $($matches.Count).";
          }

          $idx = $matches[0];
          Write-Host "Original line $($idx + 1): $($lines[$idx])";

          $lines[$idx] = "    ' Experimental: skip legacy DDK 7.1 configure check";

          [System.IO.File]::WriteAllLines($file, $lines, [System.Text.UTF8Encoding]::new($false));
          Write-Host "Patched line $($idx + 1).";

      - name: Install Yasm runtime and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";

          choco install vcredist2010 -y --no-progress;

          $url = "https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0-win64.exe";
          # Sử dụng nối chuỗi trực tiếp để tránh lỗi Join-Path
          $dir = "$env:RUNNER_TEMP\yasm";
          $exe = "$dir\yasm.exe";

          # Gán biến $null thay vì dùng dấu pipe (| Out-Null)
          $null = New-Item -ItemType Directory -Force -Path $dir;
          Invoke-WebRequest -Uri $url -OutFile $exe;

          Write-Host "=== Yasm version ===";
          $output = & $exe --version 2>&1;
          $exitCode = $LASTEXITCODE;
          
          # Dùng vòng lặp foreach thay vì dùng dấu pipe (| ForEach-Object)
          foreach ($line in $output) { Write-Host $line }

          if ($exitCode -ne 0) {
            throw "Yasm failed to start (exit code $exitCode). Check missing DLL dependencies.";
          }

          $joinedOutput = $output -join "`n";
          if ($joinedOutput -notmatch 'yasm\s+1\.3\.0') {
            throw "Expected Yasm 1.3.0.";
          }

          Add-Content -Path $env:GITHUB_PATH -Value $dir -Encoding utf8;
          Write-Host "Yasm 1.3.0 is ready.";

      # BƯỚC MỚI: Cài đặt Qt5 để biên dịch giao diện VirtualBox.exe
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtscxml'
          cache: true

      - name: Setup libSDL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $sdl_url = "https://www.libsdl.org/release/SDL-devel-1.2.15-VC.zip";
          $sdl_dir = "$env:RUNNER_TEMP\SDL";
          $null = New-Item -ItemType Directory -Force -Path $sdl_dir;
          
          Invoke-WebRequest -Uri $sdl_url -OutFile "$sdl_dir\sdl.zip";
          Expand-Archive -Path "$sdl_dir\sdl.zip" -DestinationPath $sdl_dir -Force;
          
          $sdl_path = "$sdl_dir\SDL-1.2.15";
          $libDir = "$sdl_path\lib";
          $libX64 = "$libDir\x64";
          
          if (Test-Path $libX64) {
            Copy-Item -Path "$libX64\*" -Destination $libDir -Force;
          }
          
          Add-Content -Path $env:GITHUB_ENV -Value "VBOX_SDL_PATH=$sdl_path" -Encoding utf8;
          Write-Host "Installed libSDL to $sdl_path";

      - name: Configure VirtualBox
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          $sdk = "C:\Program Files (x86)\Windows Kits\10";
          $binDir = "$sdk\bin";
          
          $latestSdk = (Get-ChildItem -Path $binDir -Directory | Where-Object { $_.Name -like "10.0.*" } | Sort-Object Name -Descending | Select-Object -First 1).Name;
          
          $srcX64 = "$binDir\$latestSdk\x64";
          $dstX64 = "$binDir\x64";
          if (-not (Test-Path $dstX64)) { $null = New-Item -ItemType Directory -Force -Path $dstX64; }
          Copy-Item -Path "$srcX64\*" -Destination $dstX64 -Recurse -Force;

          $srcX86 = "$binDir\$latestSdk\x86";
          $dstX86 = "$binDir\x86";
          if (-not (Test-Path $dstX86)) { $null = New-Item -ItemType Directory -Force -Path $dstX86; }
          Copy-Item -Path "$srcX86\*" -Destination $dstX86 -Recurse -Force;

          Write-Host "=== Configure VirtualBox ===";
          $qtDir = $env:QT_ROOT_DIR -replace '\\', '/';

          & cscript.exe //nologo configure.vbs "--with-SDK10=$sdk" "--with-libSDL=$env:VBOX_SDL_PATH" "--with-Qt=$qtDir";

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "configure.log") { Get-Content "configure.log" -Tail 200; }
            throw "VirtualBox configure failed with exit code $LASTEXITCODE.";
          }

          # --- SVN revision ---
          # Day la ban git (khong phai SVN) nen '$Rev: ... $' trong Version.kmk
          # khong duoc expand. Config.kmk:9585 thu doc revision tu commit message
          # (dong "svn:sync-xref-src-repo-rev: rNNNNN") -> commit message cua
          # chung ta khong co dong do -> VBOX_SVN_REV rong ->
          # IPRT_BLDCFG_SCM_REV rong -> buildconfig.cpp: "function must return
          # a value" (error C2561).
          # Config.kmk:9613-9622 cho phep override VBOX_SVN_REV tu ben ngoai.
          $svnRev = "0";
          $m = Select-String -Path "Version.kmk" -Pattern '\$Id: Version\.kmk (\d+)' | Select-Object -First 1;
          if ($m) { $svnRev = $m.Matches[0].Groups[1].Value };
          Write-Host "Using VBOX_SVN_REV = $svnRev";

          # Ép bật Qt6 GUI trực tiếp vào LocalConfig.kmk (phòng trường hợp configure.vbs bỏ sót Qt6)
          $localCfg = @(
            "VBOX_WITH_QTGUI = 1",
            "VBOX_GUI_USE_QGL = 1",
            "PATH_SDK_QT6 = $qtDir",
            "PATH_TOOL_QT6 = $qtDir",
            "PATH_TOOL_QT6_BIN = $qtDir/bin",
            "VBOX_PATH_QT = $qtDir",
            "VBOX_WITH_HARDENING = ",
            "VBOX_WITHOUT_ADDITIONS = 1",
            "VBOX_WITH_ADDITIONS_PACKING = ",
            "VBOX_WITH_WARNINGS_AS_ERRORS = ",
            "VBOX_WITH_TESTCASES = ",
            "VBOX_WITH_VALIDATIONKIT = ",
            "VBOX_SVN_REV = $svnRev"
          );
          Set-Content -Path "LocalConfig.kmk" -Value $localCfg -Encoding utf8;

          Write-Host "=== AutoConfig.kmk Content ===";
          if (Test-Path "AutoConfig.kmk") { Get-Content "AutoConfig.kmk"; }

      - name: Build VirtualBox
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          # Đưa thư mục bin của Qt6 (chứa lrelease.exe, moc.exe, uic.exe) vào PATH hiện tại
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH";

          $kmk = "$env:KBUILD_PATH\bin\win.amd64\kmk.exe";
          $jobs = [Environment]::ProcessorCount;
          Write-Host "Build jobs: $jobs";

          # Chạy build toàn bộ (ĐÃ BỎ VBOX_WITH_NLS= để build đầy đủ giao diện)
          & $kmk "-j$jobs";

          if ($LASTEXITCODE -ne 0) {
            throw "kmk build failed with exit code $LASTEXITCODE.";
          }

      # 2. Kiểm tra file thực thi và đóng gói kèm toàn bộ DLL cần thiết
      - name: Verify and Bundle Dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";
          $binOut = "out\win.amd64\release\bin";

          if (-not (Test-Path $binOut)) {
            throw "Output bin directory not found: $binOut";
          }

          # Copy SDL.dll vào thư mục bin
          if (Test-Path "$env:VBOX_SDL_PATH\lib\SDL.dll") {
            Copy-Item -Path "$env:VBOX_SDL_PATH\lib\SDL.dll" -Destination $binOut -Force;
          }

          # Dùng windeployqt của Qt6 để tự động gom toàn bộ DLL giao diện vào thư mục bin
          $vboxExe = "$binOut\VirtualBox.exe";
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe";
          if ((Test-Path $vboxExe) -and (Test-Path $windeployqt)) {
            Write-Host "Deploying Qt6 runtime DLLs for VirtualBox.exe...";
            & $windeployqt --release --no-translations --no-compiler-runtime $vboxExe;
          } else {
            Write-Warning "VirtualBox.exe was not generated! Listing existing .exe files:";
          }

          Write-Host "=== Generated Executables (.exe) ===";
          Get-ChildItem -Path $binOut -Filter "*.exe" | Select-Object Name, Length;

      - name: Generate build identity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          $sourceSha = ((Get-Content "source-revision.txt" | Where-Object { $_ -match '^source_sha=' }) -replace '^source_sha=', '').Trim();
          if (-not $sourceSha) { throw "source_sha not found in source-revision.txt" }
          & ".\.github\scripts\generate-build-identity.ps1" -BuildMode stock -SourceRevision ([string]$sourceSha) -OutputPath "build-identity.json";
          if ($LASTEXITCODE -ne 0) { throw "generate-build-identity.ps1 failed: $LASTEXITCODE" }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-build-diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            AutoConfig.kmk
            LocalConfig.kmk
            Config.kmk
            env.bat
            source-revision.txt
            build-identity.json
            *.log
            out/**/*.log

      - name: Upload CI scripts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloak-ci-scripts
          if-no-files-found: error
          path: .github/scripts/

      - name: Upload VirtualBox Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-7.2-windows-amd64-binaries
          if-no-files-found: error
          path: |
            out/win.amd64/release/bin/
            !out/win.amd64/release/bin/**/*.obj
            !out/win.amd64/release/bin/**/*.pdb
            !out/win.amd64/release/bin/testcase/

  # ---------------------------------------------------------------------
  # Job build kèm Guest Additions (cần WDK).
  #
  # Tách riêng khỏi job "build" vì:
  #   - job "build" nhanh, không cần WDK -> dùng để gate PR hằng ngày.
  #   - job này lâu hơn ~nửa và cần WDK -> chỉ cần khi đụng tới Guest Additions
  #     (PR-2: đổi tên driver/service/INF của GA).
  #
  # VỀ WDK (đã tra cứu tài liệu Microsoft):
  #   - VirtualBox cần lib kernel-mode cho driver GA:
  #       Include\<ver>\km\*.h        header KM
  #       Lib\<ver>\km\{x64,x86}\     lib KM (WINSDK10-KM)
  #       Lib\win7\km\x64             lib nhắm Win7 (WINSDK10-KM-W7, và -WLH dùng
  #                                  bộ lib Win7 vì WDK 10 không còn lib Vista)
  #       Lib\win8\km\x64             lib nhắm Win8 (WINSDK10-KM-W8)
  #   - WDK >= 10.0.22621 KHÔNG còn lib win7/win8.
  #   - WDK >= 10.0.22000 KHÔNG còn lib KM x86.
  #   -> WDK 10.0.19041 là bản DUY NHẤT còn cả hai, nên job này ghim version đó.
  #
  #   Tham khảo:
  #     https://learn.microsoft.com/en-us/windows-hardware/drivers/other-wdk-downloads
  # ---------------------------------------------------------------------
  full-additions:
    name: Build with Guest Additions (WDK 10.0.19041)
    runs-on: windows-2022
    timeout-minutes: 420

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      KBUILD_PATH: ${{ github.workspace }}\kBuild\kBuild
      VBOX_WITHOUT_ADDITIONS: ""
      VBOX_WITH_ADDITIONS_PACKING: "1"
      KIT_VERSION: "10.0.19041.0"

    steps:
      - name: Checkout VirtualBox
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
          submodules: recursive

      - name: Record source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $sha    = git rev-parse HEAD;
          $desc   = git log -1 --pretty="%h %s";
          $branch = git rev-parse --abbrev-ref HEAD;
          $rev = @(
            "source_repo=${{ github.repository }}",
            "source_ref=${{ github.ref_name }}",
            "source_sha=$sha",
            "source_desc=$desc",
            "source_branch=$branch"
          );
          $rev | Set-Content -Path "source-revision.txt" -Encoding utf8;
          Get-Content "source-revision.txt";

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Verify kBuild and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Source directory ==="
          Write-Host $env:VBOX_SOURCE

          Write-Host "=== kBuild directory ==="
          Write-Host $env:KBUILD_PATH

          $required = @(
            "footer.kmk",
            "header.kmk",
            "rules.kmk",
            "bin\win.amd64\kmk.exe",
            "bin\win.amd64\kmk_ash.exe",
            "bin\win.x86\kmk.exe"
          )

          foreach ($item in $required) {
            $path = "$env:KBUILD_PATH\$item"
            if (-not (Test-Path $path)) {
              throw "Missing required kBuild file: $path"
            }
            Write-Host "OK: $path"
          }

          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path "$sdk\Include")) {
            throw "Windows 10 SDK Include directory not found: $sdk"
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found. MSVC environment was not initialized."
          }

          Write-Host "=== SDK versions ==="
          Get-ChildItem "$sdk\Include" -Directory |
            Where-Object { $_.Name -like "10.0.*" } |
            Select-Object -ExpandProperty Name

      - name: Patch legacy DDK 7.1 check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $file = "$env:VBOX_SOURCE\configure.vbs";

          if (-not (Test-Path $file)) {
            throw "configure.vbs not found: $file";
          }

          $lines = [System.IO.File]::ReadAllLines($file);
          $matches = @();

          for ($i = 2000; $i -lt $lines.Length; $i++) {
            if ($lines[$i].Contains("CheckForWinDDK") -and $lines[$i].Contains("strOptDDK") -and $lines[$i] -notmatch '^\s*(sub|function)\b') {
              $matches += $i;
            }
          }

          if ($matches.Count -ne 1) {
            throw "Expected one DDK check call; found $($matches.Count).";
          }

          $idx = $matches[0];
          Write-Host "Original line $($idx + 1): $($lines[$idx])";

          $lines[$idx] = "    ' Experimental: skip legacy DDK 7.1 configure check";

          [System.IO.File]::WriteAllLines($file, $lines, [System.Text.UTF8Encoding]::new($false));
          Write-Host "Patched line $($idx + 1).";

      - name: Install Windows SDK 10.0.19041 + WDK
        # Gioi han thoi gian phong trường hợp installer treo.
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\.github\scripts\install-wdk.ps1" -KitVersion $env:KIT_VERSION;
          if ($LASTEXITCODE -ne 0) {
            throw "install-wdk.ps1 failed with exit code $LASTEXITCODE";
          }

      - name: Collect WDK installer diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue";
          Write-Host "=== downloaded MSI ===";
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wdk-msi') -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 |
            Tee-Object -FilePath 'wdk-msi-downloaded.txt';
          Write-Host "=== WDK burn logs ===";
          $logs = @();
          foreach ($dir in @($env:TEMP, (Join-Path $env:TEMP 'wdk'))) {
            if (Test-Path $dir) {
              $logs += Get-ChildItem -Path $dir -Filter '*.log' -Recurse -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -match 'Driver_Kit|Windows_Driver' }
            }
          }
          foreach ($l in $logs) {
            Write-Host "--- $($l.FullName) ---";
            Get-Content $l.FullName -Tail 120 -ErrorAction SilentlyContinue;
            Copy-Item $l.FullName "wdk-burn-$($l.Name)" -Force -ErrorAction SilentlyContinue;
          }
          Write-Host "=== kits tree ===";
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10";
          if (Test-Path $kits) {
            Get-ChildItem "$kits\Lib" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $km = Join-Path $_.FullName 'km'
              if (Test-Path $km) {
                "$($_.Name)\km -> " + ((Get-ChildItem $km -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ',')
              }
            } | Tee-Object -FilePath 'wdk-kits-tree.txt'
          }

      - name: Install Yasm runtime and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";

          choco install vcredist2010 -y --no-progress;

          $url = "https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0-win64.exe";
          $dir = "$env:RUNNER_TEMP\yasm";
          $exe = "$dir\yasm.exe";

          $null = New-Item -ItemType Directory -Force -Path $dir;
          Invoke-WebRequest -Uri $url -OutFile $exe;

          Write-Host "=== Yasm version ===";
          $output = & $exe --version 2>&1;
          $exitCode = $LASTEXITCODE;

          foreach ($line in $output) { Write-Host $line }

          if ($exitCode -ne 0) {
            throw "Yasm failed to start (exit code $exitCode). Check missing DLL dependencies.";
          }

          $joinedOutput = $output -join "`n";
          if ($joinedOutput -notmatch 'yasm\s+1\.3\.0') {
            throw "Expected Yasm 1.3.0.";
          }

          Add-Content -Path $env:GITHUB_PATH -Value $dir -Encoding utf8;
          Write-Host "Yasm 1.3.0 is ready.";

      - name: Install Bison and Flex
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";

          # Mesa needs bison/flex to generate the GLSL parser.  kBuild looks
          # for bison.exe/flex.exe, so expose the WinFlexBison binaries under
          # those names.
          $url = "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip";
          $dir = "$env:RUNNER_TEMP\winflexbison";
          $zip = "$dir\winflexbison.zip";

          $null = New-Item -ItemType Directory -Force -Path $dir;
          Invoke-WebRequest -Uri $url -OutFile $zip;
          Expand-Archive -Path $zip -DestinationPath $dir -Force;

          Copy-Item "$dir\win_bison.exe" "$dir\bison.exe" -Force;
          Copy-Item "$dir\win_flex.exe" "$dir\flex.exe" -Force;

          & "$dir\bison.exe" --version;
          if ($LASTEXITCODE -ne 0) { throw "bison.exe failed to start (exit code $LASTEXITCODE)."; }
          & "$dir\flex.exe" --version;
          if ($LASTEXITCODE -ne 0) { throw "flex.exe failed to start (exit code $LASTEXITCODE)."; }

          Add-Content -Path $env:GITHUB_PATH -Value $dir -Encoding utf8;
          Write-Host "Bison/Flex are ready.";

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtscxml'
          cache: true

      - name: Setup libSDL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $sdl_url = "https://www.libsdl.org/release/SDL-devel-1.2.15-VC.zip";
          $sdl_dir = "$env:RUNNER_TEMP\SDL";
          $null = New-Item -ItemType Directory -Force -Path $sdl_dir;

          Invoke-WebRequest -Uri $sdl_url -OutFile "$sdl_dir\sdl.zip";
          Expand-Archive -Path "$sdl_dir\sdl.zip" -DestinationPath $sdl_dir -Force;

          $sdl_path = "$sdl_dir\SDL-1.2.15";
          $libDir = "$sdl_path\lib";
          $libX64 = "$libDir\x64";

          if (Test-Path $libX64) {
            Copy-Item -Path "$libX64\*" -Destination $libDir -Force;
          }

          Add-Content -Path $env:GITHUB_ENV -Value "VBOX_SDL_PATH=$sdl_path" -Encoding utf8;
          Write-Host "Installed libSDL to $sdl_path";

      - name: Configure VirtualBox (with Guest Additions)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          $sdk = "C:\Program Files (x86)\Windows Kits\10";
          $binDir = "$sdk\bin";

          $latestSdk = (Get-ChildItem -Path $binDir -Directory | Where-Object { $_.Name -like "10.0.*" } | Sort-Object Name -Descending | Select-Object -First 1).Name;

          $srcX64 = "$binDir\$latestSdk\x64";
          $dstX64 = "$binDir\x64";
          if (-not (Test-Path $dstX64)) { $null = New-Item -ItemType Directory -Force -Path $dstX64; }
          Copy-Item -Path "$srcX64\*" -Destination $dstX64 -Recurse -Force;

          $srcX86 = "$binDir\$latestSdk\x86";
          $dstX86 = "$binDir\x86";
          if (-not (Test-Path $dstX86)) { $null = New-Item -ItemType Directory -Force -Path $dstX86; }
          Copy-Item -Path "$srcX86\*" -Destination $dstX86 -Recurse -Force;

          Write-Host "=== Configure VirtualBox ===";
          $qtDir = $env:QT_ROOT_DIR -replace '\\', '/';

          & cscript.exe //nologo configure.vbs "--with-SDK10=$sdk" "--with-libSDL=$env:VBOX_SDL_PATH" "--with-Qt=$qtDir";

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "configure.log") { Get-Content "configure.log" -Tail 200; }
            throw "VirtualBox configure failed with exit code $LASTEXITCODE.";
          }

          # --- SVN revision (xem ghi chu trong job "build") ---
          $svnRev = "0";
          $m = Select-String -Path "Version.kmk" -Pattern '\$Id: Version\.kmk (\d+)' | Select-Object -First 1;
          if ($m) { $svnRev = $m.Matches[0].Groups[1].Value };
          Write-Host "Using VBOX_SVN_REV = $svnRev";

          # LocalConfig.kmk: build Guest Additions, va thay bo DDK 7.1 bang WDK 10.
          $localCfg = @(
            "VBOX_WITH_QTGUI = 1",
            "VBOX_GUI_USE_QGL = 1",
            "PATH_SDK_QT6 = $qtDir",
            "PATH_TOOL_QT6 = $qtDir",
            "PATH_TOOL_QT6_BIN = $qtDir/bin",
            "VBOX_PATH_QT = $qtDir",
            "VBOX_WITH_HARDENING = ",
            "VBOX_WITH_WARNINGS_AS_ERRORS = ",
            "VBOX_WITH_TESTCASES = ",
            "VBOX_WITH_VALIDATIONKIT = ",
            "VBOX_SVN_REV = $svnRev",
            "# --- Guest Additions ---",
            "VBOX_WITHOUT_ADDITIONS = ",
            "VBOX_WITH_ADDITIONS_PACKING = 1",
            "# --- Driver GA dung WDK $($env:KIT_VERSION) (KM headers + libs), host dung SDK 26100 ---",
            "#     (26100 khong co lib KM x86/win7/win8; 19041 thieu XFG/WinHv cho host)",
            "VBOX_WINDDK_GST = WINSDK10-KM-GST",
            "VBOX_WINDDK_GST_W8 = WINSDK10-KM-W8-GST",
            "VBOX_WINDDK_GST_W7 = WINSDK10-KM-W7-GST",
            "VBOX_WINDDK_GST_WLH = WINSDK10-KM-WLH-GST",
            "VBOX_WINDDK_GST_W2K3 = WINSDK10-KM-W7-GST",
            "VBOX_WINDDK_GST_WXP = WINSDK10-KM-W7-GST",
            "VBOX_WINDDK_GST_W2K = WINSDK10-KM-W7-GST",
            "VBOX_WINDDK_GST_NT4 = WINSDK10-KM-W7-GST"
          );
          Set-Content -Path "LocalConfig.kmk" -Value $localCfg -Encoding utf8;

          # --- kBuild SDK tuy chinh: driver GA dung WDK 19041 (headers + libs), ---
          #     trong khi WINSDK10-KM (host) van dung SDK 26100 nhu job "build".
          $sdkDir = "$env:KBUILD_PATH\sdks";
          function Write-SdkFile([string]$fileName, [string]$contents) {
            $contents = $contents.Replace('__KIT__', $env:KIT_VERSION);
            Set-Content -Path "$sdkDir\$fileName" -Value $contents -Encoding ascii;
          }

          Write-SdkFile "WINSDK10-KM-GST.kmk" @'
          ifndef SDK_WINSDK10
           include $(KBUILD_PATH)/sdks/WINSDK10.kmk
          endif

          SDK_WINSDK10-KM-GST               := WDK __KIT__ kernel mode, Guest Additions drivers.
          SDK_WINSDK10-KM-GST_EXTENDS       := WINSDK10-KM
          SDK_WINSDK10-KM-GST_INCS          ?= $(PATH_SDK_WINSDK10_BASE_INC)/__KIT__/km $(PATH_SDK_WINSDK10_SHARED_INC)
          SDK_WINSDK10-KM-GST_LIBPATH.x86   ?= $(PATH_SDK_WINSDK10_BASE_LIB)/__KIT__/km/x86
          SDK_WINSDK10-KM-GST_LIBPATH.amd64 ?= $(PATH_SDK_WINSDK10_BASE_LIB)/__KIT__/km/x64

          PATH_SDK_WINSDK10-KM-GST_LIB.x86   ?= $(SDK_WINSDK10-KM-GST_LIBPATH.x86)
          PATH_SDK_WINSDK10-KM-GST_LIB.amd64 ?= $(SDK_WINSDK10-KM-GST_LIBPATH.amd64)
          PATH_SDK_WINSDK10-KM-GST_LIB       ?= $(PATH_SDK_WINSDK10-KM-GST_LIB.$(KBUILD_TARGET_ARCH))
          '@

          Write-SdkFile "WINSDK10-KM-W8-GST.kmk" @'
          ifndef SDK_WINSDK10
           include $(KBUILD_PATH)/sdks/WINSDK10.kmk
          endif

          SDK_WINSDK10-KM-W8-GST               := WDK __KIT__ kernel mode, Windows 8 target, Guest Additions drivers.
          SDK_WINSDK10-KM-W8-GST_EXTENDS       := WINSDK10-KM-GST
          SDK_WINSDK10-KM-W8-GST_DEFS          ?= WIN32=100 _WIN32_WINNT=0x0602 WINVER=0x0602 _WIN32_IE=0x0A00 NTDDI_VERSION=0x06020000 KMDF_MAJOR_VERSION=01 KMDF_MINOR_VERSION=011
          SDK_WINSDK10-KM-W8-GST_LIBPATH.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W8.x86)
          SDK_WINSDK10-KM-W8-GST_LIBPATH.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W8.amd64)

          PATH_SDK_WINSDK10-KM-W8-GST_LIB.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W8.x86)
          PATH_SDK_WINSDK10-KM-W8-GST_LIB.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W8.amd64)
          PATH_SDK_WINSDK10-KM-W8-GST_LIB       ?= $(PATH_SDK_WINSDK10-KM-W8-GST_LIB.$(KBUILD_TARGET_ARCH))
          '@

          Write-SdkFile "WINSDK10-KM-W7-GST.kmk" @'
          ifndef SDK_WINSDK10
           include $(KBUILD_PATH)/sdks/WINSDK10.kmk
          endif

          SDK_WINSDK10-KM-W7-GST               := WDK __KIT__ kernel mode, Windows 7 target, Guest Additions drivers.
          SDK_WINSDK10-KM-W7-GST_EXTENDS       := WINSDK10-KM-GST
          SDK_WINSDK10-KM-W7-GST_DEFS          ?= WIN32=100 _WIN32_WINNT=0x0601 WINVER=0x0601 _WIN32_IE=0x0800 NTDDI_VERSION=0x06010000 KMDF_MAJOR_VERSION=01 KMDF_MINOR_VERSION=007
          SDK_WINSDK10-KM-W7-GST_LIBPATH.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.x86)
          SDK_WINSDK10-KM-W7-GST_LIBPATH.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.amd64)

          PATH_SDK_WINSDK10-KM-W7-GST_LIB.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.x86)
          PATH_SDK_WINSDK10-KM-W7-GST_LIB.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.amd64)
          PATH_SDK_WINSDK10-KM-W7-GST_LIB       ?= $(PATH_SDK_WINSDK10-KM-W7-GST_LIB.$(KBUILD_TARGET_ARCH))
          '@

          Write-SdkFile "WINSDK10-KM-WLH-GST.kmk" @'
          ifndef SDK_WINSDK10
           include $(KBUILD_PATH)/sdks/WINSDK10.kmk
          endif

          SDK_WINSDK10-KM-WLH-GST               := WDK __KIT__ kernel mode, Windows Vista target (W7 libs), Guest Additions drivers.
          SDK_WINSDK10-KM-WLH-GST_EXTENDS       := WINSDK10-KM-GST
          SDK_WINSDK10-KM-WLH-GST_DEFS          ?= WIN32=100 _WIN32_WINNT=0x0600 WINVER=0x0600 _WIN32_IE=0x0700 NTDDI_VERSION=0x06000000 KMDF_MAJOR_VERSION=01 KMDF_MINOR_VERSION=007
          SDK_WINSDK10-KM-WLH-GST_LIBPATH.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.x86)
          SDK_WINSDK10-KM-WLH-GST_LIBPATH.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.amd64)

          PATH_SDK_WINSDK10-KM-WLH-GST_LIB.x86   ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.x86)
          PATH_SDK_WINSDK10-KM-WLH-GST_LIB.amd64 ?= $(PATH_SDK_WINSDK10_KM_LIB_W7.amd64)
          PATH_SDK_WINSDK10-KM-WLH-GST_LIB       ?= $(PATH_SDK_WINSDK10-KM-WLH-GST_LIB.$(KBUILD_TARGET_ARCH))
          '@

          Write-Host "=== AutoConfig.kmk Content ===";
          if (Test-Path "AutoConfig.kmk") { Get-Content "AutoConfig.kmk"; }
          Write-Host "=== LocalConfig.kmk Content ===";
          Get-Content "LocalConfig.kmk";

      - name: Install Mesa Python build dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          # Mesa generates sources with Python (mako).  Use the exact
          # interpreter configure selected, not whatever "python" resolves to.
          $m = Select-String -Path "AutoConfig.kmk" -Pattern '^VBOX_BLD_PYTHON\s*:=\s*(.+)$' | Select-Object -First 1;
          if (-not $m) { throw "VBOX_BLD_PYTHON not found in AutoConfig.kmk"; }
          $py = $m.Matches[0].Groups[1].Value.Trim();
          Write-Host "Build Python: $py";

          & $py -m pip install --disable-pip-version-check --no-input mako;
          if ($LASTEXITCODE -ne 0) {
            throw "pip install mako failed with exit code $LASTEXITCODE";
          }

          & $py -c "import mako; print('Mako ' + mako.__version__)";
          if ($LASTEXITCODE -ne 0) {
            throw "Mako import failed with exit code $LASTEXITCODE";
          }

      - name: Build VirtualBox with Guest Additions
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH";

          $kmk = "$env:KBUILD_PATH\bin\win.amd64\kmk.exe";
          $jobs = [Environment]::ProcessorCount;
          Write-Host "Build jobs: $jobs";

          & $kmk "-j$jobs";

          if ($LASTEXITCODE -ne 0) {
            throw "kmk build failed with exit code $LASTEXITCODE.";
          }

      - name: Verify Guest Additions artifacts
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop";

          $add = "out\win.amd64\release\bin\additions";
          $core = @("VBoxGuest.sys", "VBoxService.exe", "VBoxTray.exe", "VBoxControl.exe");
          $extra = @("VBoxSF.sys", "VBoxMouse.sys", "VBoxVideo.sys", "VBoxWddm.sys", "VBoxCertUtil.exe");

          $missingCore = @();
          foreach ($f in $core + $extra) {
            $p = Join-Path $add $f;
            if (Test-Path $p) {
              Write-Host ("  OK   {0,-24} {1,10:N0} bytes" -f $f, (Get-Item $p).Length);
            }
            else {
              Write-Host ("  MISS {0}" -f $f) -ForegroundColor Yellow;
              if ($core -contains $f) { $missingCore += $f };
            }
          }

          $iso = "out\win.amd64\release\bin\VBoxGuestAdditions.iso";
          if (Test-Path $iso) {
            Write-Host ("  OK   {0,-24} {1,10:N0} bytes" -f "VBoxGuestAdditions.iso", (Get-Item $iso).Length);
          }
          else {
            Write-Host "  MISS VBoxGuestAdditions.iso" -ForegroundColor Yellow;
          }

          if ($missingCore.Count -gt 0) {
            throw "Missing core Guest Additions artifacts: $($missingCore -join ', ')"
          }

      - name: Upload Guest Additions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-guest-additions
          if-no-files-found: warn
          path: |
            out/win.amd64/release/bin/additions/
            out/win.amd64/release/bin/VBoxGuestAdditions.iso

      - name: Upload build diagnostics (additions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-additions-build-diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            AutoConfig.kmk
            LocalConfig.kmk
            env.bat
            source-revision.txt
            wdk-layout-info.txt
            wdk-kit-tree.txt
            wdk-msi-downloaded.txt
            wdk-burn-*.log
            wdk-kits-tree.txt
            *.log
            out/**/*.log

  # ---------------------------------------------------------------------
  # Smoke test: chạy 1 VM headless và thu thập identity mà guest nhìn thấy.
  #
  # Mục tiêu:
  #   1. Xác nhận binary build ra thực sự chạy được và enumerate PCI được.
  #   2. Chứng minh identity ỔN ĐỊNH giữa 2 lần mở cùng 1 VM
  #      (yêu cầu: random nhưng không đổi -> seed từ VM UUID).
  #   3. Tạo artifact "identity" để so sánh giữa 2 commit/PR.
  # ---------------------------------------------------------------------
  smoke:
    name: Smoke test (cloak identity)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # KHÔNG checkout ở job này: repo rất lớn (~1.4 GB pack) nên clone lần thứ hai
      # rất tốn thời gian. Script được lấy từ artifact của job build.
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: virtualbox-7.2-windows-amd64-binaries
          path: vbox

      - name: Download build diagnostics
        uses: actions/download-artifact@v4
        with:
          name: virtualbox-windows-build-diagnostics
          path: diagnostics

      - name: Download CI scripts
        uses: actions/download-artifact@v4
        with:
          name: cloak-ci-scripts
          path: scripts

      - name: Verify manifest verifier fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\scripts\verify-manifest.ps1" -ManifestPath ".\scripts\testdata\build-identity.cloak.json" -RequireCloak;
          if ($LASTEXITCODE -ne 0) { throw "verify-manifest.ps1 failed: $LASTEXITCODE" }

      - name: Verify embedded manifest header generator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          $header = Join-Path $env:RUNNER_TEMP "CloakBuildIdentity.h";
          & ".\scripts\generate-build-identity-header.ps1" -ManifestPath ".\scripts\testdata\build-identity.cloak.json" -OutputPath $header;
          if ($LASTEXITCODE -ne 0) { throw "generate-build-identity-header.ps1 failed: $LASTEXITCODE" }
          if (-not (Select-String -LiteralPath $header -Pattern "FC03B2E69D912989C87289C8CC8A48A39F8B991894203ACA56706F87E297FDC5" -SimpleMatch -Quiet)) { throw "generated header is missing the expected build hash" }

      - name: Verify generated build identity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          $sourceSha = ((Get-Content "diagnostics\source-revision.txt" | Where-Object { $_ -match '^source_sha=' }) -replace '^source_sha=', '').Trim();
          if (-not $sourceSha) { throw "source_sha not found in build diagnostics" }
          & ".\scripts\verify-manifest.ps1" -ManifestPath ".\diagnostics\build-identity.json" -ExpectedSourceRevision ([string]$sourceSha);
          if ($LASTEXITCODE -ne 0) { throw "verify-manifest.ps1 failed: $LASTEXITCODE" }

      - name: Show which revision was built
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "diagnostics\source-revision.txt") {
            Get-Content "diagnostics\source-revision.txt"
          } else {
            Write-Warning "source-revision.txt not found in diagnostics artifact"
          }

      - name: Register COM server
        shell: cmd
        run: vbox\VBoxSVC.exe /RegServer

      - name: Scan built binaries for identity strings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\scripts\scan-identity.ps1" -VBoxDir "vbox" -OutFile "binary-identity.txt";
          if ($LASTEXITCODE -ne 0) { throw "scan-identity.ps1 failed: $LASTEXITCODE" }

      - name: Collect guest-visible identity (ICH9 + BIOS)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\scripts\collect-identity.ps1" `
            -VBoxDir "vbox" `
            -OutDir "identity-out\ich9-bios" `
            -VmName "cloak-smoke-ich9-bios" `
            -HardwareUuid "9f2c1d40-7a51-4c62-9b8e-0d3a5e6f7c81";
          if ($LASTEXITCODE -ne 0) { throw "collect-identity (ich9-bios) failed: $LASTEXITCODE" }

      - name: Collect guest-visible identity (PIIX3 + BIOS)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\scripts\collect-identity.ps1" `
            -VBoxDir "vbox" `
            -OutDir "identity-out\piix3-bios" `
            -VmName "cloak-smoke-piix3-bios" `
            -HardwareUuid "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d" `
            -Chipset "piix3";
          if ($LASTEXITCODE -ne 0) { throw "collect-identity (piix3-bios) failed: $LASTEXITCODE" }

      - name: Collect guest-visible identity (ICH9 + EFI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force;
          & ".\scripts\collect-identity.ps1" `
            -VBoxDir "vbox" `
            -OutDir "identity-out\ich9-efi" `
            -VmName "cloak-smoke-ich9-efi" `
            -HardwareUuid "2b3c4d5e-6f70-4b8c-9d0e-1f2a3b4c5d6e" `
            -Firmware "efi";
          if ($LASTEXITCODE -ne 0) { throw "collect-identity (ich9-efi) failed: $LASTEXITCODE" }

      - name: Upload identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloak-identity-report
          if-no-files-found: warn
          path: |
            identity-out/
            binary-identity.txt
            diagnostics/build-identity.json

      - name: Summarise identity
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "identity-out" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) =====";
            $stability = Join-Path $_.FullName "stability.txt";
            if (Test-Path $stability) { Get-Content $stability };
          };
          Write-Host "===== PCI identity (ich9-bios, run 1) =====";
          $pci = "identity-out\ich9-bios\run1\info-pci.txt";
          if (Test-Path $pci) { Get-Content $pci -TotalCount 100 };
